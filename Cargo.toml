[package]
name = "auction-assign"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dcollison/auction-assign"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
