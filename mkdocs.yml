site_name: auction-assign
site_description: Fast Bertsekas auction algorithm for linear sum assignment in Rust with Python bindings
site_author: Dale Collison
site_url: https://dcollison.github.io/auction-assign/
repo_url: https://github.com/dcollison/auction-assign
repo_name: dcollison/auction-assign
edit_uri: edit/main/docs/

exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Algorithm & Formulation: guide/algorithm.md
      - Gating & Partial Assignment: guide/gating.md
      - Benchmarks & Performance: guide/benchmarks.md
  - API Reference: reference.md
  - Changelog: changelog.md
