[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "auction-assign"
version = "0.1.1"
description = "Fast Bertsekas auction algorithm for linear sum assignment in Rust with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/dcollison/auction-assign"
Repository = "https://github.com/dcollison/auction-assign"
Issues = "https://github.com/dcollison/auction-assign/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "scipy>=1.11",
    "ruff>=0.8",
    "mypy>=1.13",
    "maturin>=1.9,<2.0",
]

[tool.maturin]
python-source = "python"
module-name = "auction_assign._core"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
