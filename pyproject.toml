[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "auction-assign"
version = "0.1.2"
description = "Fast Bertsekas auction algorithm for linear sum assignment in Rust with Python bindings"
readme = "README.md"
authors = [
    { name = "Dale Collison", email = "dale.a.collison@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dcollison/auction-assign"
Documentation = "https://dcollison.github.io/auction-assign/"
Repository = "https://github.com/dcollison/auction-assign"
Issues = "https://github.com/dcollison/auction-assign/issues"
Changelog = "https://github.com/dcollison/auction-assign/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "scipy>=1.11",
    "ruff>=0.8",
    "mypy>=1.13",
    "maturin>=1.9,<2.0",
    "pre-commit>=4.6.2",
    "pre-commit-uv>=4.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.maturin]
python-source = "python"
module-name = "auction_assign._core"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
