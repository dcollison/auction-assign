name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: ""
          - name: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: ""
          - name: windows-x64
            os: windows-latest
            target: x64
            manylinux: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Smoke test wheel (${{ matrix.platform.name }})
    needs: [build-wheels]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - name: macos-x86_64
            os: macos-15-intel
            artifact: wheels-macos-x86_64
          - name: macos-aarch64
            os: macos-latest
            artifact: wheels-macos-aarch64
          - name: windows-x64
            os: windows-latest
            artifact: wheels-windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv run --isolated --no-project --with "$WHEEL" --with pytest pytest -v tests/test_correctness.py

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/auction-assign
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Inspect distribution artifacts
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
